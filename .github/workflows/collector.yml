# GitHub Actions workflow to run the price‑comparison collectors
#
# This workflow installs the Python dependencies (including Playwright),
# installs the Playwright Chromium browsers, optionally creates a SQLite
# test database, and runs `collector/run_once.py`.
#
# It runs on every push to the `main` branch and on a schedule (default
# every 6 hours).  Adjust the `cron` expression as needed.

name: Collectors CI

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch:

jobs:
  run-collectors:
    runs-on: ubuntu-latest

    env:
      # Set a repository secret named DATABASE_URL to collect from the app's database.
      # The ephemeral SQLite database is only a fallback for CI without that secret.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite+aiosqlite:///test.db' }}
      PYTHONPATH: ${{ github.workspace }}/backend
      # Run Chromium in headed mode on a virtual display, matching the local GUI run.
      COLLECTOR_BROWSER_HEADLESS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('collector/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Install Playwright browsers
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          python -m playwright install --with-deps chromium

      # Optional: create SQLite schema for CI testing
      - name: Initialise SQLite schema (if using SQLite)
        if: ${{ env.DATABASE_URL == 'sqlite+aiosqlite:///test.db' }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${{ github.workspace }}/backend"
          python - <<PY
          import asyncio, os
          from app.core.database import engine, Base
          async def create():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
          asyncio.run(create())
          PY
          
          sqlite3 test.db < database/init.sql

      - name: Run collector (run_once.py)
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1365x900x24" python collector/run_once.py

      - name: Upload collector logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-logs
          path: collector/*.log
