name: FarmaCompare - Coleta de Precos

on:
  schedule:
    # Executa a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botao no GitHub

jobs:
  run-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'collector/requirements.txt'

      - name: Instalar dependencias do Collector
        run: |
          pip install -r collector/requirements.txt

      - name: Executar Ciclo de Coleta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOG_LEVEL: INFO
        run: |
          python collector/run_once.py
